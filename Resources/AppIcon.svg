<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20264A"/>
      <stop offset="1" stop-color="#5B2E8F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.34" r="0.45">
      <stop offset="0" stop-color="#8E7CFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8E7CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="eq" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#5DE0B5"/>
      <stop offset="1" stop-color="#FF8FB8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <clipPath id="squircle"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>
  <g filter="url(#shadow)"><rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/></g>
  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <!-- the island -->
    <rect x="232" y="300" width="560" height="168" rx="84" fill="#000"/>
    <!-- Moci -->
    <circle cx="330" cy="384" r="46" fill="#F4F1EA"/>
    <ellipse cx="314" cy="380" rx="7" ry="10" fill="#1A1A1A"/>
    <ellipse cx="346" cy="380" rx="7" ry="10" fill="#1A1A1A"/>
    <!-- equalizer -->
    <rect x="602" y="354" width="18" height="60" rx="9" fill="url(#eq)"/>
    <rect x="634" y="334" width="18" height="100" rx="9" fill="url(#eq)"/>
    <rect x="666" y="364" width="18" height="40" rx="9" fill="url(#eq)"/>
    <rect x="698" y="344" width="18" height="80" rx="9" fill="url(#eq)"/>
    <!-- the open island's rows -->
    <rect x="232" y="560" width="560" height="22" rx="11" fill="#fff" opacity="0.12"/>
    <rect x="232" y="610" width="380" height="22" rx="11" fill="#fff" opacity="0.08"/>
    <rect x="232" y="660" width="460" height="22" rx="11" fill="#fff" opacity="0.06"/>
  </g>
</svg>
