name: Build DynaIsland

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Compiler
        run: xcrun swiftc --version

      - name: Build MediaRemoteAdapter (Now Playing from every app, BSD-3)
        run: |
          git clone https://github.com/ungive/mediaremote-adapter.git "$RUNNER_TEMP/mra"
          git -C "$RUNNER_TEMP/mra" checkout 0e82bf1c44ec39554fbfc402ec88a48c6ae2a0fd
          cmake -S "$RUNNER_TEMP/mra" -B "$RUNNER_TEMP/mra/build" -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          cmake --build "$RUNNER_TEMP/mra/build" --config Release
          mkdir -p vendor
          cp -R "$RUNNER_TEMP/mra/build/MediaRemoteAdapter.framework" vendor/
          cp "$RUNNER_TEMP/mra/bin/mediaremote-adapter.pl" vendor/
          cp "$RUNNER_TEMP/mra/LICENSE" vendor/MediaRemoteAdapter-LICENSE.txt
          lipo -info vendor/MediaRemoteAdapter.framework/MediaRemoteAdapter || true
          # Smoke test: the adapter must answer on this runner (prints null or JSON).
          /usr/bin/perl vendor/mediaremote-adapter.pl "$PWD/vendor/MediaRemoteAdapter.framework" get --no-artwork > "$RUNNER_TEMP/get.txt" 2>&1 &
          PID=$!
          for i in $(seq 1 20); do kill -0 $PID 2>/dev/null || break; sleep 1; done
          kill $PID 2>/dev/null || true
          wait $PID && echo "adapter ok: $(head -c 200 "$RUNNER_TEMP/get.txt")" || echo "::warning::adapter get did not succeed: $(head -c 300 "$RUNNER_TEMP/get.txt")"

      - name: Build (Apple Silicon + Intel)
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x build.sh
          ./build.sh --release

      - name: Test local signing (what each Mac does after installing)
        run: |
          cp -R build/DynaIsland.app "$RUNNER_TEMP/Test.app"
          bash ./sign-local.sh "$RUNNER_TEMP/Test.app"
          codesign -dvv "$RUNNER_TEMP/Test.app" 2>&1 | grep -E "Authority|Identifier|Signature" || true
          codesign -dr - "$RUNNER_TEMP/Test.app" 2>&1
          # Second run must reuse the same certificate (same requirement = permissions kept).
          REQ1="$(codesign -dr - "$RUNNER_TEMP/Test.app" 2>&1 | tail -1)"
          bash ./sign-local.sh "$RUNNER_TEMP/Test.app"
          REQ2="$(codesign -dr - "$RUNNER_TEMP/Test.app" 2>&1 | tail -1)"
          echo "$REQ1"; echo "$REQ2"
          [[ "$REQ1" == "$REQ2" && "$REQ1" == *"certificate"* ]] || { echo "::error::Local signing is not stable"; exit 1; }

      - name: Package
        run: |
          ditto -c -k --keepParent build/DynaIsland.app DynaIsland-app.zip
          echo "${{ github.run_number }}" > version.txt
          ls -la DynaIsland-app.zip version.txt

      - name: Publish release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest DynaIsland-app.zip version.txt \
            --title "DynaIsland versi ${{ github.run_number }}" \
            --notes "Pasang atau perbarui dengan satu baris di Terminal: curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash" \
            --target "${{ github.sha }}" \
            --latest
